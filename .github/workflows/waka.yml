name: Waka Readme

on:
  schedule:
    - cron: "0 0 * * *"   # раз в день
  workflow_dispatch:       # ручной запуск

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_LANGUAGE: "True"          # языки по времени
          SHOW_COMMIT: "True"            # в какое время суток коммитишь
          SHOW_DAYS_OF_WEEK: "True"      # по каким дням недели
          SHOW_EDITORS: "True"
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_LOC_CHART: "False"
          SHOW_SHORT_INFO: "False"
